name: DDoS Test
on:
  workflow_dispatch:

jobs:
  run-flood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Requests
        run: pip install requests
      - name: Run Script
        run: python flood.py
